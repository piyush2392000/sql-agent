services:
  - type: web
    name: sql-query-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_API_KEY
        sync: false          
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
