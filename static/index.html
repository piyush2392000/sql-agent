<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL Query Agent</title>
<style>
:root{
  --bg:#f3f0e8; --panel:#fbfaf6; --panel2:#f1eee5; --ink:#25292a; --muted:#7a7d77; --line:#e2ded1;
  --accent:#4d7872; --accent-soft:#e3ece8; --accent-ink:#fff;
  --ok:#4f7d5c; --warn:#a07a2c; --err:#a4524a; --ok-bg:#e6efe6; --warn-bg:#f4ecd8; --err-bg:#f3e2de;
  --kw:#5f6fa0; --fn:#4d7872; --str:#a76b46; --num:#8a7a2b; --cmt:#9a9c94;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
:root[data-theme=dark]{
  --bg:#141716; --panel:#1a1e1d; --panel2:#212625; --ink:#e4e6e0; --muted:#8c918a; --line:#2b302e;
  --accent:#86b0a7; --accent-soft:#223230; --accent-ink:#10201d;
  --ok:#8fbf9b; --warn:#d2ae63; --err:#d98c82; --ok-bg:#1f2d22; --warn-bg:#2f2917; --err-bg:#331f1c;
  --kw:#9aa8d6; --fn:#86b0a7; --str:#d9a07a; --num:#cdbb6a; --cmt:#6d726c;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{color:var(--accent-ink);filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
/* header */
header{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:9px;font:600 18px var(--serif);letter-spacing:.2px}
.logo{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.logo svg{width:15px;height:15px}
.sp{flex:1}
.dbchip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 12px;font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px;font-size:13px}
label.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
input[type=checkbox]{accent-color:var(--accent)}
/* layout */
main{flex:1;min-height:0;display:grid;grid-template-columns:230px minmax(340px,1fr) minmax(380px,1.05fr);gap:14px;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.card>h2,.rail h3{margin:0;font:600 11px system-ui;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:12px 16px 8px}
.scroll{overflow:auto;min-height:0;flex:1}
/* rail */
.rail .hist{padding:0 8px 8px;display:flex;flex-direction:column;gap:2px}
.hist button{text-align:left;background:none;border:0;border-radius:8px;padding:6px 9px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist button:hover,.hist button.on{background:var(--accent-soft)}
details.tbl{padding:3px 16px;font-size:13px}
details.tbl summary{cursor:pointer;padding:2px 0}
details.tbl ul{margin:2px 0 6px;padding-left:14px;color:var(--muted);font:12px var(--mono);list-style:none}
.empty{color:var(--muted);font-size:13px;padding:8px 16px}
/* chat */
#chat{padding:18px;display:flex;flex-direction:column;gap:18px}
.user{align-self:flex-end;max-width:85%;background:var(--accent-soft);border-radius:14px 14px 3px 14px;padding:8px 13px}
.bot{display:flex;gap:11px;align-items:flex-start}
.avatar{width:26px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);flex:none;margin-top:1px}
.bot .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.bot.sel .sqlbox{border-color:var(--accent)}
.reading{font-size:15px;line-height:1.6}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;border-radius:6px;padding:1px 7px;margin-bottom:4px}
.tag.refused{background:var(--warn-bg);color:var(--warn)}.tag.error{background:var(--err-bg);color:var(--err)}.tag.clarify{background:var(--accent-soft);color:var(--accent)}
/* steps */
.steps{border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:13px;overflow:hidden}
.steps .head{display:flex;align-items:center;gap:8px;padding:7px 11px;cursor:pointer;color:var(--muted);user-select:none}
.steps .head b{color:var(--ink);font-weight:600}
.steps .chev{transition:transform .2s}
.steps.closed .chev{transform:rotate(-90deg)}
.steps.closed ol{display:none}
.steps ol{list-style:none;margin:0;padding:2px 11px 9px}
.steps li{display:flex;align-items:center;gap:9px;padding:2px 0;animation:in .25s ease}
.steps li .t{margin-left:auto;color:var(--muted);font:11.5px var(--mono)}
.steps li .ic{width:16px;height:16px;display:grid;place-items:center;color:var(--ok)}
.steps li.retry{color:var(--warn)}.steps li.retry .ic{color:var(--warn)}
.steps li.run{color:var(--muted)}
.pill{font-size:11px;border-radius:999px;padding:0 8px;background:var(--warn-bg);color:var(--warn);font-weight:600}
.spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}@keyframes in{from{opacity:0;transform:translateY(3px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* sql box */
.sqlbox{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}
.sqlbox .bar{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.sqlbox pre{margin:0;padding:11px 13px;overflow:auto;font:12.8px/1.6 var(--mono);white-space:pre}
.k{color:var(--kw);font-weight:600}.f{color:var(--fn)}.s{color:var(--str)}.n{color:var(--num)}.c{color:var(--cmt);font-style:italic}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.meta a{color:var(--accent);cursor:pointer}
ul.plain{margin:4px 0 0;padding-left:18px}
/* examples + composer */
.examples{display:flex;flex-wrap:wrap;gap:8px;padding:6px 18px 0}
.hello{padding:26px 18px 6px}.hello h1{font:600 24px var(--serif);margin:0 0 4px}
.examples button{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
.examples button:hover{border-color:var(--accent);color:var(--accent)}
.composer{margin:0 14px 14px;display:flex;align-items:flex-end;gap:6px;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:6px 6px 6px 12px}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{flex:1;resize:none;border:0;background:none;outline:0;padding:6px 0;max-height:130px}
.icon{width:34px;height:34px;border-radius:10px;border:0;display:grid;place-items:center;background:none;color:var(--muted)}
.icon:hover{background:var(--accent-soft);color:var(--accent)}
.icon.send{background:var(--accent);color:var(--accent-ink)}.icon.send:hover{background:var(--accent);filter:brightness(1.07)}
.icon.send:disabled{opacity:.4}
.icon.rec{background:var(--err-bg);color:var(--err);animation:pulse 1.2s ease infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--err) 18%,transparent)}}
/* workbench */
.wb .head{padding:12px 16px 4px;display:flex;align-items:center;gap:8px}
.wb .head h2{margin:0;font:600 11px system-ui;letter-spacing:1px;text-transform:uppercase;color:var(--muted);flex:1}
.wb .sec{padding:4px 16px 10px}
.wb .sec h4{margin:8px 0 5px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--muted);font-size:13px;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.tabs .ct{font-size:11px;background:var(--panel2);border-radius:999px;padding:0 6px;margin-left:4px}
.pane{padding:12px 16px 16px}
.tablewrap{overflow:auto;max-height:46vh;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel2);font-weight:600;cursor:pointer}
tbody tr:hover{background:var(--accent-soft)}
td.num{text-align:right;font-variant-numeric:tabular-nums}td.null{color:var(--muted);font-style:italic}
.check{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.check:last-child{border:0}
.check .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none}
.check .ic svg{width:12px;height:12px;stroke-width:2.6}
.ic.ok{background:var(--ok-bg);color:var(--ok)}.ic.warn{background:var(--warn-bg);color:var(--warn)}.ic.err{background:var(--err-bg);color:var(--err)}
.cost{margin:6px 0 4px}
.costbar{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--ok-bg) 0 33%,var(--warn-bg) 33% 66%,var(--err-bg) 66% 100%);border:1px solid var(--line)}
.costbar i{position:absolute;top:-4px;width:4px;height:18px;border-radius:3px;background:var(--ink);transform:translateX(-50%);transition:left .4s}
.costlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.code{font:12px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-top:5px;overflow:auto;white-space:pre}
.plan div{font:12px var(--mono);padding:2px 0;color:var(--muted)}.plan .scan{color:var(--warn)}.plan .search{color:var(--ok)}
.placeholder{padding:34px 22px;text-align:center;color:var(--muted)}
.banner{margin:10px 18px 0;padding:8px 12px;border-radius:10px;background:var(--err-bg);color:var(--err);font-size:13px}
/* dialog */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,24,22,.45)}
.dlg h3{margin:0;font:600 20px var(--serif);padding:18px 22px 4px}
.dlg .tabs{padding:6px 18px 0}
.dlg form{padding:16px 22px 20px;display:flex;flex-direction:column;gap:10px}
.dlg input[type=text],.dlg input[type=password],.dlg input[type=number],.dlg textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:8px 10px}
.dlg textarea{min-height:150px;font:12.5px var(--mono);resize:vertical}
.dlg label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.row2{display:grid;grid-template-columns:1fr 100px;gap:10px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;align-items:center}
.note{font-size:12px;color:var(--muted);background:var(--panel2);border-radius:8px;padding:7px 10px}
.mtabs{display:none}
@media(max-width:1100px){
  main{grid-template-columns:1fr;padding:10px}
  .rail{display:none}
  .mtabs{display:flex;gap:6px;padding:8px 10px 0}
  body[data-view=chat] .wb,body[data-view=wb] .chatcard{display:none}
}
</style>
</head>
<body data-view="chat">
<header>
  <div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M4 7c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3Z"/><path d="M4 7v5c0 1.7 3.6 3 8 3s8-1.3 8-3V7M4 12v5c0 1.7 3.6 3 8 3s8-1.3 8-3v-5"/></svg></span>SQL Query Agent</div>
  <span class="dbchip" title="Active database"><span class="dot"></span><span id="dbname">Sample company</span></span>
  <button class="btn" id="addschema"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add schema</button>
  <span class="sp"></span>
  <select id="dialect" title="SQL dialect"><option value="sqlite">SQLite</option><option value="postgres">PostgreSQL</option><option value="mysql">MySQL</option></select>
  <label class="chk"><input type="checkbox" id="exec" checked> Run query</label>
  <button class="btn" id="theme" title="Toggle theme"></button>
  <button class="btn" id="new">New chat</button>
</header>
<div id="banner" class="banner" hidden></div>
<div class="mtabs"><button class="btn" data-v="chat">Chat</button><button class="btn" data-v="wb">Workbench</button></div>
<main>
  <section class="card rail">
    <h3>History</h3>
    <div class="scroll" style="flex:.45"><div class="hist" id="hist"></div></div>
    <h3 style="border-top:1px solid var(--line)">Schema</h3>
    <div class="scroll" id="schema"></div>
  </section>

  <section class="card chatcard">
    <div class="scroll" id="chatscroll">
      <div class="hello" id="hello"><h1>What would you like to know?</h1><div class="muted">Ask in plain English, or paste SQL to explain, optimize or debug.</div></div>
      <div class="examples" id="examples"></div>
      <div id="chat"></div>
    </div>
    <form class="composer" id="form">
      <textarea id="input" rows="1" maxlength="4000" placeholder="Ask about your data…"></textarea>
      <button type="button" class="icon" id="mic" title="Voice input"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="icon send" id="send" type="submit" title="Send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
  </section>

  <section class="card wb" id="wb"></section>
</main>

<dialog id="dlg" class="dlg">
  <h3>Add a database</h3>
  <div class="tabs" id="dtabs"><button class="on" data-t="sqlite">Upload SQLite</button><button data-t="schema">Paste schema</button><button data-t="pg">PostgreSQL</button></div>
  <form id="dform">
    <div data-p="sqlite"><label class="drop" id="drop">Drop a .db / .sqlite file here or click to browse<input type="file" id="file" accept=".db,.sqlite,.sqlite3,.db3" hidden><div id="fname" style="margin-top:6px;color:var(--ink)"></div></label></div>
    <div data-p="schema" hidden><label>CREATE TABLE statements<textarea id="ddl" placeholder="CREATE TABLE customers (&#10;  id INTEGER PRIMARY KEY,&#10;  name TEXT NOT NULL&#10;);"></textarea></label></div>
    <div data-p="pg" hidden style="display:none;flex-direction:column;gap:10px">
      <div class="row2"><label>Host<input type="text" id="pghost" placeholder="db.example.com"></label><label>Port<input type="number" id="pgport" value="5432"></label></div>
      <label>Database<input type="text" id="pgdb"></label>
      <div class="row2" style="grid-template-columns:1fr 1fr"><label>User<input type="text" id="pguser"></label><label>Password<input type="password" id="pgpw"></label></div>
      <div class="note">Read-only: queries run in a read-only transaction with a short timeout. Use a read-only database role.</div>
    </div>
    <label>Name (optional)<input type="text" id="dname" placeholder="My database"></label>
    <div id="derr" class="banner" style="margin:0" hidden></div>
    <div class="foot"><button type="button" class="btn ghost" id="dcancel">Cancel</button><button class="btn primary" id="dok" type="submit">Add database</button></div>
  </form>
</dialog>

<script>
(() => {
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k,d){ try { return localStorage.getItem(k) ?? d } catch { return d } }, set(k,v){ try { localStorage.setItem(k,v) } catch {} } };
const I = {
  check:'<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>', x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  warn:'<svg viewBox="0 0 24 24"><path d="M12 7v6M12 17h.01"/></svg>', retry:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5l2 2M20 4v5h-5M20 12a8 8 0 0 1-14 5l-2-2M4 20v-5h5"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  dl:'<svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>', chev:'<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  bot:'<svg viewBox="0 0 24 24"><path d="M5 9h14v9H5zM12 4v5M9 13h.01M15 13h.01"/></svg>'
};
const LABEL = {
  guard:['Checked the request','Checking the request'], intent:['Understood the question','Understanding the question'],
  info:['Answered from the schema','Reading the schema'], schema:['Read the tables','Reading the tables'],
  generate:['Wrote the SQL','Writing the SQL'], validate:['Validated the query','Validating the query'],
  optimize:['Checked performance','Checking performance'], execute:['Ran the query','Running the query'],
  explain:['Wrote the plain-English reading','Writing the reading'], respond:null
};
const NEXT = { guard:'intent', intent:'schema', schema:'generate', generate:'validate', validate:'optimize', optimize:'execute', execute:'explain' };
const EXAMPLES = ['Show all employees hired after January 2024','Total sales amount per product category','Top 5 customers by total order value','Which departments have an average salary above 90000?'];

let sessionId = null, busy = false, turns = [], cur = null, tab = 'results';

/* theme */
function theme(t){ document.documentElement.dataset.theme = t; $('theme').textContent = t === 'dark' ? 'Light' : 'Dark'; store.set('sqlagent.theme', t); }
theme(store.get('sqlagent.theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('theme').onclick = () => theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

/* sql highlight + format (string safe) */
const KW = new Set('select from where group by order having limit offset join inner left right full outer cross on using as and or not in is null like between exists case when then else end distinct union all with asc desc over partition'.split(' '));
const FN = new Set('count sum avg min max round coalesce ifnull strftime date datetime substr lower upper length cast abs'.split(' '));
function highlight(sql){
  const re = /(--[^\n]*|\/\*[\s\S]*?\*\/)|('(?:[^']|'')*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g; let o = '', m;
  while ((m = re.exec(sql))) {
    if (m[1]) o += `<span class="c">${esc(m[1])}</span>`; else if (m[2]) o += `<span class="s">${esc(m[2])}</span>`;
    else if (m[3]) o += `<span class="n">${esc(m[3])}</span>`;
    else if (m[4]) { const w = m[4].toLowerCase(), fn = FN.has(w) && /^\s*\(/.test(sql.slice(re.lastIndex)); o += fn ? `<span class="f">${esc(m[4])}</span>` : KW.has(w) ? `<span class="k">${esc(m[4])}</span>` : esc(m[4]); }
    else o += esc(m[5]);
  } return o;
}
function pretty(sql){
  return sql.split(/('(?:[^']|'')*')/).map((p,i) => i % 2 ? p : p.replace(/\s+/g,' ')
    .replace(/\s+(FROM|WHERE|GROUP BY|ORDER BY|HAVING|LIMIT|UNION ALL|UNION)\b/gi,'\n$1')
    .replace(/\s+((?:LEFT |RIGHT |INNER |FULL |CROSS )?(?:OUTER )?JOIN)\b/gi,'\n  $1')).join('').trim();
}
function download(name, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
async function copy(text, btn){
  try { await navigator.clipboard.writeText(text); } catch { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  const o = btn.innerHTML; btn.innerHTML = I.check + 'Copied'; setTimeout(() => btn.innerHTML = o, 1300);
}
const csv = r => { const q = v => v === null ? '' : /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g,'""') + '"' : String(v); return [r.columns.map(q).join(','), ...r.rows.map(x => x.map(q).join(','))].join('\n'); };
const fmt = ms => ms < 950 ? Math.round(ms) + ' ms' : (ms/1000).toFixed(1) + ' s';

/* sql block with Copy / Download */
function sqlBox(resp){
  const box = document.createElement('div'); box.className = 'sqlbox';
  box.innerHTML = `<div class="bar"><span>SQL · ${esc(resp.dialect)}</span><span class="sp"></span><button class="btn ghost" data-a="copy">${I.copy}Copy SQL</button><button class="btn ghost" data-a="dl">${I.dl}Download .sql</button></div><pre>${highlight(pretty(resp.sql))}</pre>`;
  box.querySelector('[data-a=copy]').onclick = e => copy(resp.sql, e.currentTarget);
  box.querySelector('[data-a=dl]').onclick = () => download('query.sql', pretty(resp.sql) + ';\n', 'text/plain');
  return box;
}

/* live steps */
function newSteps(){
  const el = document.createElement('div'); el.className = 'steps';
  el.innerHTML = `<div class="head"><span class="spin"></span><span class="ttl"><b>Working</b></span><span class="sp"></span><span class="chev">${I.chev}</span></div><ol></ol>`;
  el.querySelector('.head').onclick = () => el.classList.toggle('closed');
  return { el, list: [], t0: performance.now(), last: performance.now(), seen: {}, retries: 0 };
}
function paint(s, done){
  const ol = s.el.querySelector('ol'); ol.innerHTML = '';
  s.list.forEach(x => { const li = document.createElement('li'); li.className = x.retry ? 'retry' : '';
    li.innerHTML = `<span class="ic">${x.retry ? I.retry : I.check}</span><span>${esc(x.label)}</span>${x.retry ? '<span class="pill">retry</span>' : ''}<span class="t">${fmt(x.ms)}</span>`; ol.appendChild(li); });
  if (!done) { const nxt = NEXT[s.list.at(-1)?.node] ; const li = document.createElement('li'); li.className = 'run';
    li.innerHTML = `<span class="ic"><span class="spin"></span></span><span>${esc(s.list.length ? (LABEL[nxt]?.[1] || 'Working') : 'Checking the request')}…</span>`; ol.appendChild(li); }
}
function stepDone(s, node){
  if (!LABEL[node]) return;
  const now = performance.now(); const retry = node === 'generate' && s.seen.generate;
  s.seen[node] = true; if (retry) s.retries++;
  s.list.push({ node, label: retry ? 'Corrected the query' : LABEL[node][0], ms: now - s.last, retry }); s.last = now; paint(s, false);
}
function stepsFinish(s){
  paint(s, true); const total = performance.now() - s.t0, n = s.list.length;
  s.el.querySelector('.head').innerHTML = `<span style="color:var(--ok);display:grid">${I.check}</span><span>Ran <b>${n} step${n===1?'':'s'}</b> in <b>${(total/1000).toFixed(1)} s</b></span>${s.retries ? `<span class="pill">${I.retry.replace('<svg','<svg style="width:11px;height:11px;vertical-align:-1px"')} ${s.retries} correction${s.retries>1?'s':''}</span>` : ''}<span class="sp"></span><span class="chev">${I.chev}</span>`;
  s.el.classList.add('closed'); return { steps: s.list, total, retries: s.retries };
}

/* workbench */
function renderWB(){
  const wb = $('wb'), r = cur?.resp;
  if (!r || !r.sql) { wb.innerHTML = `<div class="head"><h2>Workbench</h2></div><div class="placeholder">${r ? esc(r.message || 'No SQL was produced.') : 'Ask a question — the SQL, explanation, results, checks and performance appear here.'}</div>`; return; }
  const v = r.validation || {}, opt = r.optimization || {}, plan = opt.plan, res = r.result;
  const nChecks = 3 + (v.warnings?.length || 0);
  wb.innerHTML = `<div class="head"><h2>Workbench</h2></div><div class="scroll"><div class="sec" id="wbsql"></div>
    ${r.explanation ? `<div class="sec"><h4>Explanation</h4>${esc(r.explanation)}</div>` : ''}
    ${r.notes?.length ? `<div class="sec"><h4>${r.intent==='debug'?'What was wrong':'Changes'}</h4><ul class="plain">${r.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>` : ''}
    <div class="tabs"><button data-t="results">Results${res?.row_count!=null?`<span class="ct">${res.row_count}</span>`:''}</button><button data-t="checks">Checks<span class="ct">${nChecks}</span></button><button data-t="perf">Performance</button></div>
    <div class="pane" id="pane"></div></div>`;
  $('wbsql').appendChild(sqlBox(r));
  wb.querySelectorAll('.tabs button').forEach(b => { b.classList.toggle('on', b.dataset.t === tab); b.onclick = () => { tab = b.dataset.t; renderWB(); }; });
  const pane = $('pane');
  if (tab === 'results') {
    if (!res) pane.innerHTML = `<div class="placeholder">Execution is off.<br><br><button class="btn primary" id="runq">Run query</button></div>`;
    else if (res.error) pane.innerHTML = `<div class="banner" style="margin:0">${esc(res.error)}</div>`;
    else if (!res.columns?.length) pane.innerHTML = '<div class="placeholder">The query returned no columns.</div>';
    else {
      pane.innerHTML = `<div class="tablewrap"><table><thead><tr>${res.columns.map((c,i)=>`<th data-i="${i}">${esc(c)}</th>`).join('')}</tr></thead><tbody></tbody></table></div>
      <div class="meta" style="margin-top:8px"><span>${res.row_count} row${res.row_count===1?'':'s'}${res.truncated?' (truncated)':''} · ${res.elapsed_ms} ms</span><span class="sp"></span><button class="btn" id="csv">${I.dl}Download CSV</button></div>`;
      let rows = res.rows.slice(), dir = 1; const body = pane.querySelector('tbody');
      const draw = () => body.innerHTML = rows.map(x => '<tr>' + x.map(c => c === null ? '<td class="null">NULL</td>' : `<td class="${typeof c==='number'?'num':''}">${esc(c)}</td>`).join('') + '</tr>').join('') || `<tr><td colspan="${res.columns.length}" class="muted">No rows returned.</td></tr>`;
      draw();
      pane.querySelectorAll('th').forEach(th => th.onclick = () => { const i = +th.dataset.i; rows.sort((a,b) => (a[i] ?? '') > (b[i] ?? '') ? dir : -dir); dir = -dir; draw(); });
      $('csv').onclick = () => download('results.csv', csv(res), 'text/csv');
    }
    const rq = $('runq'); if (rq) rq.onclick = async () => { rq.disabled = true; try { const x = await fetch('/api/execute', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sql:r.sql,dialect:r.dialect})}); r.result = x.ok ? await x.json() : {error:(await x.json()).detail||'Failed'}; } catch(e){ r.result = {error:String(e)}; } renderWB(); };
  } else if (tab === 'checks') {
    const rows = [['ok','Single statement','No stacked statements'],['ok','Read-only','SELECT / WITH only, no write keywords'],[v.valid?'ok':'err','Schema check', v.valid ? 'Syntax, tables and columns all resolve' : (v.errors||[]).join('; ')]];
    (v.warnings||[]).forEach(w => rows.push(['warn','Join / dialect note', w]));
    if (r.attempts > 1) rows.unshift(['warn','Self-corrected', `The first attempt was rejected; fixed on attempt ${r.attempts}`]);
    pane.innerHTML = rows.map(([k,t,d]) => `<div class="check"><span class="ic ${k}">${k==='ok'?I.check:k==='err'?I.x:I.warn}</span><div><b>${esc(t)}</b><div class="muted">${esc(d)}</div></div></div>`).join('');
  } else {
    const lvl = plan?.estimated_cost || 'unknown', pos = { low:14, medium:50, high:86 }[lvl] ?? 50;
    pane.innerHTML = `<div class="cost"><b style="text-transform:capitalize">${esc(lvl)} cost</b> <span class="muted">· ${plan?.full_scans ?? 0} full scan(s), ${plan?.temp_structures ?? 0} temp structure(s)</span><div class="costbar" style="margin-top:8px"><i style="left:${pos}%"></i></div><div class="costlbl"><span>Low</span><span>Medium</span><span>High</span></div></div>
      <h4 class="muted" style="margin:14px 0 2px">Indexes</h4>${opt.indexes?.length ? opt.indexes.map(i=>`<div class="muted" style="margin-top:6px">${esc(i.reason)}</div><div class="code">${esc(i.ddl)}</div>`).join('') : '<div class="muted">No index suggestions.</div>'}
      ${opt.suggestions?.length ? `<h4 class="muted" style="margin:14px 0 2px">Suggestions</h4><ul class="plain">${opt.suggestions.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>` : ''}
      <h4 class="muted" style="margin:14px 0 4px">Query plan</h4><div class="plan">${(plan?.steps||[]).map(s=>`<div class="${/^SCAN/.test(s)?'scan':/^SEARCH/.test(s)?'search':''}">${esc(s)}</div>`).join('') || '<div>—</div>'}</div>`;
  }
}

/* chat */
const scroll = () => { const s = $('chatscroll'); s.scrollTop = s.scrollHeight; };
function select(i){ cur = turns[i]; document.querySelectorAll('.bot').forEach(b => b.classList.toggle('sel', b.dataset.i == i)); tab = 'results'; renderWB(); renderHist(); }
function renderHist(){ const h = $('hist'); h.innerHTML = turns.length ? '' : '<div class="empty">Your questions appear here.</div>';
  turns.forEach((t,i) => { const b = document.createElement('button'); b.textContent = t.user; b.title = t.user; if (t === cur) b.className = 'on'; b.onclick = () => { select(i); document.body.dataset.view = 'wb'; }; h.appendChild(b); }); }
function botShell(){ const d = document.createElement('div'); d.className = 'bot'; d.innerHTML = `<div class="avatar">${I.bot}</div><div class="body"></div>`; $('chat').appendChild(d); return d; }

async function send(text){
  text = text.trim(); if (busy || !text) return; busy = true; $('send').disabled = true; showBanner('');
  $('hello').style.display = $('examples').style.display = 'none';
  const u = document.createElement('div'); u.className = 'user'; u.textContent = text; $('chat').appendChild(u);
  const bot = botShell(), body = bot.querySelector('.body'), st = newSteps(); body.appendChild(st.el); paint(st, false); scroll();
  let final = null, err = null;
  try {
    const res = await fetch('/api/chat/stream', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message:text, session_id:sessionId, dialect:$('dialect').value, execute:$('exec').checked }) });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `Server error (${res.status})`);
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) { const { value, done } = await rd.read(); if (done) break; buf += dec.decode(value, {stream:true}); let k;
      while ((k = buf.indexOf('\n\n')) >= 0) { const blk = buf.slice(0,k); buf = buf.slice(k+2);
        const ev = /^event: (.+)$/m.exec(blk)?.[1], dt = /^data: (.+)$/m.exec(blk)?.[1]; if (!ev || !dt) continue; const d = JSON.parse(dt);
        if (ev === 'session') sessionId = d.session_id; else if (ev === 'step') { stepDone(st, d.node); scroll(); } else if (ev === 'final') final = d; else if (ev === 'error') err = d.detail; } }
  } catch (e) { err = e.message || 'Network error'; }
  if (err || !final) { st.el.remove(); body.innerHTML = `<div><span class="tag error">Error</span><div class="reading">${esc(err || 'No response received.')}</div></div>`; showBanner(err || ''); }
  else {
    const trace = stepsFinish(st); final.trace = trace;
    const ok = final.status === 'ok' && final.sql, tag = { refused:'Declined', clarify:'Question', error:'Could not complete' }[final.status];
    const rd = document.createElement('div');
    rd.innerHTML = (tag ? `<span class="tag ${final.status}">${tag}</span>` : '') + `<div class="reading">${esc(ok ? (final.explanation || 'Here is the query.') : (final.message || final.explanation || ''))}</div>`;
    body.appendChild(rd);
    if (ok) {
      body.appendChild(sqlBox(final));
      if (final.notes?.length && ['debug','optimize'].includes(final.intent)) { const n = document.createElement('div'); n.innerHTML = `<div class="muted">${final.intent==='debug'?'What was wrong':'What changed'}</div><ul class="plain">${final.notes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`; body.appendChild(n); }
      const m = document.createElement('div'); m.className = 'meta';
      m.innerHTML = (final.result && !final.result.error ? `<span>${final.result.row_count} row${final.result.row_count===1?'':'s'} · ${final.result.elapsed_ms} ms</span>` : '') + (final.optimization?.plan ? `<span>· ${esc(final.optimization.plan.estimated_cost)} cost</span>` : '') + `<a>Open in workbench →</a>`;
      body.appendChild(m);
    }
    const i = turns.push({ user:text, resp:final }) - 1; bot.dataset.i = i; bot.onclick = () => select(i); body.querySelector('a')?.addEventListener('click', () => document.body.dataset.view = 'wb'); select(i);
  }
  busy = false; $('send').disabled = false; $('input').focus(); scroll();
}
function showBanner(m){ const b = $('banner'); b.textContent = m; b.hidden = !m; }
$('form').onsubmit = e => { e.preventDefault(); const t = $('input').value; $('input').value = ''; size(); send(t); };
$('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); } });
const size = () => { const t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 130) + 'px'; };
$('input').addEventListener('input', size);
$('new').onclick = () => { sessionId = null; turns = []; cur = null; $('chat').innerHTML = ''; $('hello').style.display = $('examples').style.display = ''; renderWB(); renderHist(); showBanner(''); };
document.querySelectorAll('.mtabs button').forEach(b => b.onclick = () => document.body.dataset.view = b.dataset.v);

/* mic (Web Speech API) */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null;
if (!SR) { $('mic').disabled = true; $('mic').title = 'Voice input is not supported in this browser'; $('mic').style.opacity = .4; }
$('mic').onclick = () => {
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = navigator.language || 'en-US'; rec.interimResults = true; const base = $('input').value ? $('input').value + ' ' : '';
  rec.onresult = e => { $('input').value = base + [...e.results].map(r => r[0].transcript).join(''); size(); };
  rec.onerror = e => { if (e.error === 'not-allowed') showBanner('Microphone permission was denied.'); };
  rec.onend = () => { rec = null; $('mic').classList.remove('rec'); $('input').focus(); };
  $('mic').classList.add('rec'); rec.start();
};

/* add schema dialog */
let dtab = 'sqlite';
$('addschema').onclick = () => { $('derr').hidden = true; $('dlg').showModal(); };
$('dcancel').onclick = () => $('dlg').close();
function setTab(t){ dtab = t; document.querySelectorAll('#dtabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  document.querySelectorAll('[data-p]').forEach(p => { const on = p.dataset.p === t; p.hidden = !on; p.style.display = on ? (t === 'pg' ? 'flex' : 'block') : 'none'; }); }
document.querySelectorAll('#dtabs button').forEach(b => b.onclick = () => setTab(b.dataset.t)); setTab('sqlite');
$('file').onchange = () => $('fname').textContent = $('file').files[0]?.name || '';
['dragover','dragleave','drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.toggle('over', ev === 'dragover'); if (ev === 'drop' && e.dataTransfer.files[0]) { $('file').files = e.dataTransfer.files; $('file').onchange(); } }));
$('dform').onsubmit = async e => {
  e.preventDefault(); const err = $('derr'); err.hidden = true; $('dok').disabled = true;
  try {
    let res; const name = $('dname').value;
    if (dtab === 'sqlite') { if (!$('file').files[0]) throw new Error('Choose a SQLite file first.'); const fd = new FormData(); fd.append('file', $('file').files[0]); fd.append('name', name); res = await fetch('/api/databases/sqlite', { method:'POST', body: fd }); }
    else { const body = dtab === 'schema' ? { sql: $('ddl').value, name } : { host:$('pghost').value, port:+$('pgport').value, database:$('pgdb').value, user:$('pguser').value, password:$('pgpw').value, name };
      res = await fetch('/api/databases/' + (dtab === 'schema' ? 'schema' : 'postgres'), { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }); }
    if (res.status === 404 || res.status === 405) throw new Error('This server does not support adding databases yet — the backend endpoints are not installed.');
    const j = await res.json().catch(() => ({})); if (!res.ok) throw new Error(j.detail || 'Could not add the database.');
    $('dbname').textContent = j.name || name || 'Database'; $('dlg').close(); $('new').click();
  } catch (x) { err.textContent = x.message; err.hidden = false; }
  $('dok').disabled = false;
};

/* init */
EXAMPLES.forEach(q => { const b = document.createElement('button'); b.type = 'button'; b.textContent = q; b.onclick = () => send(q); $('examples').appendChild(b); });
fetch('/api/schema').then(r => r.json()).then(s => { $('schema').innerHTML = Object.entries(s).map(([t, i]) => `<details class="tbl"><summary>${esc(t)} <span class="muted">${i.row_count ?? ''}</span></summary><ul>${i.columns.map(c => `<li>${esc(c.name)} <span style="opacity:.6">${esc(c.type)}</span>${c.pk ? ' ·pk' : ''}</li>`).join('')}</ul></details>`).join(''); }).catch(() => {});
fetch('/api/health').then(r => r.json()).then(h => { if (!h.llm_configured) showBanner('The server has no LLM API key configured (set LLM_API_KEY).'); }).catch(() => {});
renderWB(); renderHist();
})();
</script>
